services:

  mongodb:
    image: mongo:8
    container_name: chatapp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./Backend
    container_name: chatapp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      MONGO_URI: mongodb://mongodb:27017/chatapp
    depends_on:
      - mongodb
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app

  frontend:
    build:
      context: ./Frontend/chatApp
    container_name: chatapp-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend/chatApp:/app