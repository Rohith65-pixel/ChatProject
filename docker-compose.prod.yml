services:
  backend:
    build:
      context: .
      dockerfile: ./Backend/Dockerfile
    container_name: chatapp-backend
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      # MONGODB_URI is read from ./Backend/.env (e.g. your Atlas connection string)
    env_file:
      - ./Backend/.env
