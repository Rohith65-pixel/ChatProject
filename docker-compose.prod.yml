services:
  mongodb:
    image: mongo:8
    container_name: chatapp-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: ./Backend/Dockerfile
    container_name: chatapp-backend
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017/chatapp
    env_file:
      - ./Backend/.env
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
